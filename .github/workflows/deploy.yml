name: Deploy

# Deploys every client in deployments/ when main changes, or on demand.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/setup.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clients:
        description: "Client slugs separated by spaces (empty = all)"
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy
        env:
          CLIENTS: ${{ inputs.clients }}
        run: |
          if [ -n "$CLIENTS" ]; then
            # Word splitting is intended: one argument per slug.
            node scripts/deploy.mjs $CLIENTS
          else
            node scripts/deploy.mjs --all
          fi
